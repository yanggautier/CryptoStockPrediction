version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-crypto_db}
      POSTGRES_USER:     ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./backend/ml/data:/app/ml/data
    env_file:
      - .env
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-secret}@postgres/${POSTGRES_DB:-crypto_db}
      REDIS_URL:     redis://redis:6379/0
      SECRET_KEY:    ${DJANGO_SECRET_KEY:-dev-secret-key}
      DEBUG:         ${DEBUG:-1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core worker -l info -Q training,default
    volumes:
      - ./backend:/app
      - ./backend/ml/data:/app/ml/data
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-secret}@postgres/${POSTGRES_DB:-crypto_db}
      REDIS_URL:     redis://redis:6379/0
      SECRET_KEY:    ${DJANGO_SECRET_KEY:-dev-secret-key}
    depends_on:
      - django
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core beat -l info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL:  postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-secret}@postgres/${POSTGRES_DB:-crypto_db}
      REDIS_URL:     redis://redis:6379/0
      SECRET_KEY:    ${DJANGO_SECRET_KEY:-dev-secret-key}
    depends_on:
      - redis
      - django

  nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
      CHOKIDAR_USEPOLLING:  "true"
    depends_on:
      - django

volumes:
  postgres_data: